name: OrangeFox Recovery Build

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Branch (12.1, 14.1, 16.0)'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree Git Repository URL'
        required: true
        default: 'https://github.com/kelexine/ofrp_device_cubot_marlon'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Tree Target Path'
        required: true
        default: 'device/cubot/marlon'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'marlon'
      MAKEFILE_NAME:
        description: 'Device Product Makefile Name'
        required: true
        default: 'ofox_marlon'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Display Build Parameters
        run: |
          echo "=========================================================="
          echo "Building OrangeFox Recovery for Cubot P50 (marlon)"
          echo "OrangeFox Branch   : ${{ github.event.inputs.FOX_BRANCH }}"
          echo "Device Tree URL    : ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch : ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path        : ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name        : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product Makefile   : ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target       : ${{ github.event.inputs.BUILD_TARGET }}image"
          echo "Triggered by       : ${{ github.actor }}"
          echo "Run ID             : ${{ github.run_id }}"
          echo "=========================================================="

      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Reclaiming disk space on runner..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Build Environment
        run: |
          sudo apt-get update -yq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends \
              bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
              imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
              libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
              pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 tar openjdk-11-jdk patch
          sudo update-java-alternatives -s java-1.11.0-openjdk-amd64 || true

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Initialize & Sync OrangeFox Workspace
        run: |
          git config --global user.name "kelexine"
          git config --global user.email "frankiekelechi@gmail.com"
          git config --global color.ui false

          WORKSPACE_DIR="${{ github.workspace }}/workspace"
          mkdir -p "$WORKSPACE_DIR"

          echo "Cloning official OrangeFox sync engine..."
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync

          cd ~/OrangeFox_sync
          ./orangefox_sync.sh --branch "${{ github.event.inputs.FOX_BRANCH }}" --path "$WORKSPACE_DIR"

          echo "WORKSPACE=$WORKSPACE_DIR" >> $GITHUB_ENV

      - name: Clone Device Tree
        run: |
          rm -rf ./${{ github.event.inputs.DEVICE_PATH }}
          git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        working-directory: ${{ env.WORKSPACE }}

      - name: Apply Compatibility & Stability Patches
        run: |
          echo "Patching Clang uninitialized pattern bug in AIDL..."
          sed -i 's/const AidlConstantReference\* found;/const AidlConstantReference* found = nullptr;/g' system/tools/aidl/aidl_language.cpp || true

          echo "Defusing AIDL API break check in build rules..."
          sed -i 's/Command: `(${aidlCmd} ${optionalFlags} --checkapi=${checkApiLevel} ${old} ${new} && touch ${out}) || ` +/Command: `touch ${out}`, \/\/ defused/g' system/tools/aidl/build/aidl_api.go || true

          echo "Fixing Soong CWD path handling for theme resources..."
          python3 - << 'EOF'
          import os
          path = "bootable/recovery/gui/libguitwrp_defaults.go"
          if os.path.exists(path):
              with open(path, "r") as f:
                  s = f.read()
              old1 = 'func copyThemeResources(ctx android.BaseContext, dirs []string, files []string) {\n\toutDir := ctx.Config().Getenv("OUT")\n\ttwRes := outDir + "/recovery/root/twres/"'
              new1 = 'func copyThemeResources(ctx android.BaseContext, dirs []string, files []string) {\n\toutDir := ctx.Config().Getenv("OUT")\n\tif outDir == "" { outDir = "out/target/product/" + getMakeVars(ctx, "TARGET_DEVICE") }\n\tif !path.IsAbs(outDir) { outDir = path.Join(getBuildAbsDir(ctx), outDir) }\n\ttwRes := outDir + "/recovery/root/twres/"'
              old2 = 'func copyCustomTheme(ctx android.BaseContext, customTheme string) {\n\toutDir := ctx.Config().Getenv("OUT")\n\ttwRes := outDir + "/recovery/root/twres/"'
              new2 = 'func copyCustomTheme(ctx android.BaseContext, customTheme string) {\n\toutDir := ctx.Config().Getenv("OUT")\n\tif outDir == "" { outDir = "out/target/product/" + getMakeVars(ctx, "TARGET_DEVICE") }\n\tif !path.IsAbs(outDir) { outDir = path.Join(getBuildAbsDir(ctx), outDir) }\n\ttwRes := outDir + "/recovery/root/twres/"'
              if old1 in s:
                  s = s.replace(old1, new1).replace(old2, new2)
                  with open(path, "w") as f:
                      f.write(s)
                  print("Patched libguitwrp_defaults.go successfully")
          EOF

          echo "Guarding theme version sed in recovery Android.mk..."
          sed -i 's|sed -i "s/{themeversion}/$(TW_THEME_VERSION)\/" $(TARGET_RECOVERY_ROOT_OUT)\/twres\/splash.xml;|if [ -f $(TARGET_RECOVERY_ROOT_OUT)/twres/splash.xml ]; then sed -i "s/{themeversion}/$(TW_THEME_VERSION)/" $(TARGET_RECOVERY_ROOT_OUT)/twres/splash.xml; fi;|g' bootable/recovery/Android.mk || true
          sed -i 's|sed -i "s/{themeversion}/$(TW_THEME_VERSION)\/" $(TARGET_RECOVERY_ROOT_OUT)\/twres\/ui.xml;|if [ -f $(TARGET_RECOVERY_ROOT_OUT)/twres/ui.xml ]; then sed -i "s/{themeversion}/$(TW_THEME_VERSION)/" $(TARGET_RECOVERY_ROOT_OUT)/twres/ui.xml; fi;|g' bootable/recovery/Android.mk || true
        working-directory: ${{ env.WORKSPACE }}

      - name: Compile Recovery Image
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        working-directory: ${{ env.WORKSPACE }}

      - name: Package Artifacts & Checksums
        id: package
        run: |
          OUT_DIR="${{ env.WORKSPACE }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          DIST_DIR="${{ github.workspace }}/artifacts"
          mkdir -p "$DIST_DIR"

          # Copy OrangeFox flashable zips, images and md5 checksums if present
          find "$OUT_DIR" -maxdepth 2 -type f \( -name "OrangeFox-*.zip" -o -name "OrangeFox-*.img" -o -name "*.md5" \) -exec cp {} "$DIST_DIR/" \; || true

          # Fallback check for recovery image
          if [ -f "$OUT_DIR/recovery.img" ] && [ ! -f "$DIST_DIR/recovery.img" ]; then
              cp "$OUT_DIR/recovery.img" "$DIST_DIR/OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-$(date +'%Y%m%d').img"
              cp "$OUT_DIR/recovery.img" "$DIST_DIR/recovery.img"
          elif [ -f "$OUT_DIR/boot.img" ] && [ ! -f "$DIST_DIR/recovery.img" ]; then
              cp "$OUT_DIR/boot.img" "$DIST_DIR/OrangeFox-boot-${{ github.event.inputs.DEVICE_NAME }}-$(date +'%Y%m%d').img"
              cp "$OUT_DIR/boot.img" "$DIST_DIR/recovery.img"
          fi

          if [ ! -f "$DIST_DIR/recovery.img" ]; then
              FOX_IMG=$(find "$DIST_DIR" -maxdepth 1 -name "OrangeFox-*.img" | head -n 1)
              if [ -n "$FOX_IMG" ]; then
                  cp "$FOX_IMG" "$DIST_DIR/recovery.img"
              fi
          fi

          cd "$DIST_DIR"
          if [ -f recovery.img ]; then
              tar -czvf "OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-fastboot.tar.gz" recovery.img
          fi

          md5sum *.img *.tar.gz *.zip > MD5SUMS.txt 2>/dev/null || true
          sha256sum *.img *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

          echo "RELEASE_TAG=OFRP-v12.1-$(date +'%Y%m%d')-${{ github.run_id }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/artifacts/*.zip
            ${{ github.workspace }}/artifacts/*.img
            ${{ github.workspace }}/artifacts/*.tar.gz
            ${{ github.workspace }}/artifacts/MD5SUMS.txt
            ${{ github.workspace }}/artifacts/SHA256SUMS.txt
          name: OrangeFox Recovery R12.1 for Cubot P50 (${{ env.RELEASE_TAG }})
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## 🦊 OrangeFox Recovery R12.1 for Cubot P50 (`marlon`)
            
            **Release Tag:** `${{ env.RELEASE_TAG }}`  
            **Build Date:** `${{ env.BUILD_DATE }}`  
            **Maintainer:** kelexine  
            **Status:** Unofficial / FBE v2 Decryption & Dynamic Super Supported

            ---

            ### 🚀 Highlights & Features
            - **OrangeFox R12.1 Base**: Native Fox theme engine, advanced console, zip installer engine, and Magiskboot integration.
            - **Display & Notch Adaptation**: Correct layout padding and waterdrop notch alignment (`OF_SCREEN_H=1520`, `OF_STATUS_H=80`, `OF_CLOCK_POS=1`).
            - **TrustKernel TEE Keymaster & Gatekeeper**: Hardware-backed `/data` decryption (FBE v2 AES-256-XTS + CTS).
            - **Dynamic Super Partitions**: Full logical partition management for `system`, `vendor`, and `product`.
            - **Full GNU Toolchain**: Built-in `bash`, `nano`, `tar`, `sed`, `xz` binaries.
            - **Complete Radio & NVRAM Backup**: Full backup and restore support for `NVRAM`, `NVDATA`, `NVCFG`, `protect_f`, `protect_s`, and `proinfo`.

            ---

            ### ⚡ Flashing Instructions

            #### Option A: Flash via Fastboot
            ```bash
            # 1. Reboot device to fastboot/bootloader mode:
            adb reboot bootloader

            # 2. Disable Android Verified Boot (AVB) verification flags:
            fastboot --disable-verity --disable-verification flash vbmeta vbmeta.img

            # 3. Flash OrangeFox recovery image:
            fastboot flash recovery recovery.img

            # 4. Reboot directly into recovery:
            fastboot reboot recovery
            ```

            #### Option B: Flash via Existing Custom Recovery
            - Copy `OrangeFox-marlon-*.zip` to your MicroSD or internal storage.
            - Boot into your existing recovery and flash the zip package directly.

            ---

            ### 🔒 Checksums
            Please verify artifact integrity before flashing using the attached `SHA256SUMS.txt` or `MD5SUMS.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
